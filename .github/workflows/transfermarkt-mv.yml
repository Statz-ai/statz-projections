name: Transfermarkt market values

# Refreshes transfermarkt_market_value_snapshots from GitHub egress IPs — the
# prod server's IP is AWS-WAF-challenged (HTTP 202) since Jul 2026, so this
# must NOT be moved onto the projection box.
#
# HOWEVER, as of Aug 2026 this workflow no longer works either: Transfermarkt's
# WAF now challenges GitHub's runner ranges too, so every run aborts on the
# first league. Last data landed 21 Jul 2026. The block is by IP range, not
# behaviour — a slower cadence will not help, and residential connections are
# what it is not aimed at.
#
# Left enabled and scheduled so it resumes on its own if the ranges are ever
# unblocked. It now exits non-zero when blocked (it used to exit 0 and report
# success), so a red run here means still-blocked, not newly-broken.
#
# Cadence: weekly, and only as a probe. Real collection moved to a launchd
# agent on George's Mac on 2026-08-07 (~/.statz/mv-scrape/), which is on a
# residential connection and therefore not challenged. That agent runs weekly,
# daily through the transfer windows, because squad value is a weighted
# component of the team rating behind the outrights page.

on:
  schedule:
    # Weekly only. This no longer fetches the data — the Mac agent does — so
    # its job is to answer one question: are GitHub's runners still blocked?
    # A daily probe answered that six more times a week than anyone needed,
    # at the cost of a failure email every morning. The day this goes green,
    # the WAF has relaxed and the scrape can move back off the laptop.
    - cron: '43 5 * * 1'          # Mondays 05:43 UTC — odd minute, politer than :00
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python scripts/scrape_market_values.py
        env:
          STATZ_INTERNAL_API_TOKEN: ${{ secrets.STATZ_INTERNAL_API_TOKEN }}
